<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RedAnt</title>
<link rel="stylesheet" href="popup.css">
</head>
<body data-status="idle">
<header>
  <img src="icons/icon32.png" alt="" width="20" height="20">
  <span class="name">RedAnt</span>
  <span id="ver" class="ver"></span>
</header>
<main>
  <div id="title" class="title"></div>
  <div id="step" class="step">Starting…</div>
  <section id="result" hidden>
    <div class="label">Saved to</div>
    <div id="path" class="path"></div>
    <div id="summary" class="summary"></div>
    <div class="row">
      <button id="copy" type="button">Copy path</button>
      <button id="show" type="button" class="secondary">Show in folder</button>
    </div>
  </section>
  <div id="error" class="error" hidden></div>
  <button id="again" type="button" class="secondary wide" hidden>Snapshot this page again</button>
  <details>
    <summary>Details</summary>
    <pre id="log"></pre>
  </details>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
